<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>COLOR PREDICTION – JALWA G@ME OFFICIAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Bebas+Neue&family=Noto+Sans+Devanagari:wght@700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #ff2d55;
      --green: #00e676;
      --violet: #d500f9;
      --gold: #ffd600;
      --bg: #08030f;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: #fff;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 60% 45% at 10% 10%, rgba(255,45,85,.2) 0%, transparent 55%),
        radial-gradient(ellipse 55% 50% at 90% 90%, rgba(213,0,249,.15) 0%, transparent 55%),
        radial-gradient(ellipse 40% 35% at 50% 50%, rgba(0,230,118,.08) 0%, transparent 60%),
        var(--bg);
      pointer-events: none;
    }

    /* Floating bg balls */
    .balls-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .ball { position: absolute; border-radius: 50%; animation: floatBall linear infinite; }
    .ball:nth-child(1) { width:70px; height:70px; background:var(--red);    opacity:.09; left:5%;  top:65%; animation-duration:13s; }
    .ball:nth-child(2) { width:45px; height:45px; background:var(--green);  opacity:.09; left:80%; top:15%; animation-duration:17s; animation-delay:-5s; }
    .ball:nth-child(3) { width:55px; height:55px; background:var(--violet); opacity:.08; left:55%; top:75%; animation-duration:19s; animation-delay:-9s; }
    @keyframes floatBall {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-60px) rotate(180deg); }
    }

    /* WRAPPER — one screen */
    .wrapper {
      position: relative;
      z-index: 1;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 16px 20px;
    }

    /* LIVE BADGE */
    .live-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,45,85,.12);
      border: 1px solid rgba(255,45,85,.35);
      border-radius: 50px;
      padding: 4px 16px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--red);
      text-transform: uppercase;
    }
    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 7px var(--red);
      animation: blink 1.3s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }

    /* LOGO */
    .logo-ring {
      position: relative;
      width: 115px; height: 115px;
      flex-shrink: 0;
    }
    .ring-svg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      animation: spinRing 8s linear infinite;
    }
    @keyframes spinRing { to { transform: rotate(360deg); } }
    .logo-inner {
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.15);
    }
    .logo-inner img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* TITLE */
    .title-block { text-align: center; line-height: 1; }
    .title-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(30px, 9vw, 50px);
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--red) 0%, var(--gold) 40%, var(--green) 70%, #448aff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.05;
    }
    .title-sub {
      font-size: clamp(10px, 2.5vw, 13px);
      font-weight: 600;
      letter-spacing: 5px;
      color: rgba(255,255,255,.4);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* COLOR BALLS */
    .color-balls { display: flex; align-items: center; gap: 10px; }
    .cb {
      width: 26px; height: 26px;
      border-radius: 50%;
      position: relative;
      animation: cbPop 2s ease-in-out infinite;
    }
    .cb::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      animation: cbRing 2s ease-in-out infinite;
    }
    .cb.r { background:var(--red);    box-shadow:0 0 10px var(--red);    animation-delay:0s; }
    .cb.g { background:var(--green);  box-shadow:0 0 10px var(--green);  animation-delay:.35s; }
    .cb.v { background:var(--violet); box-shadow:0 0 10px var(--violet); animation-delay:.7s; }
    .cb.r::after { border-color:var(--red);    }
    .cb.g::after { border-color:var(--green);  animation-delay:.35s; }
    .cb.v::after { border-color:var(--violet); animation-delay:.7s; }
    @keyframes cbPop  { 0%,100%{transform:scale(1)}   50%{transform:scale(1.2)} }
    @keyframes cbRing { 0%,100%{opacity:.3;transform:scale(1)} 50%{opacity:.9;transform:scale(1.4)} }

    /* TAGLINE */
    .tagline {
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      color: var(--gold);
      border-left: 3px solid var(--red);
      border-right: 3px solid var(--green);
      padding: 7px 16px;
      background: rgba(255,214,0,.05);
      border-radius: 6px;
      max-width: 320px;
      line-height: 1.6;
    }
    .tagline span { color: var(--green); }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: min(380px, 90vw);
    }
    .stat-card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .stat-card::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
    }
    .stat-card.s1::after { background: var(--green); }
    .stat-card.s2::after { background: #448aff; }
    .stat-card.s3::after { background: var(--gold); }
    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 1px;
      line-height: 1;
    }
    .stat-card.s1 .stat-num { color: var(--green); }
    .stat-card.s2 .stat-num { color: #448aff; }
    .stat-card.s3 .stat-num { color: var(--gold); }
    .stat-lbl {
      font-size: 8.5px;
      font-weight: 700;
      color: rgba(255,255,255,.38);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* PILLS */
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      max-width: 370px;
    }
    .pill {
      font-size: 10.5px;
      font-weight: 600;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 50px;
      padding: 4px 12px;
      color: rgba(255,255,255,.6);
    }

    /* CTA */
    .cta-wrap {
      width: min(380px, 90vw);
      position: relative;
    }
    .cta-glow {
      position: absolute;
      inset: -6px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--green), var(--violet));
      opacity: .22;
      filter: blur(14px);
      animation: glowPulse 2s ease-in-out infinite;
    }
    @keyframes glowPulse { 0%,100%{opacity:.18} 50%{opacity:.4} }
    .cta-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(135deg, #00c853, #00e676);
      color: #000;
      text-decoration: none;
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .5px;
      padding: 15px 22px;
      border-radius: 13px;
      overflow: hidden;
      text-transform: uppercase;
      animation: btnScale 2.5s ease-in-out infinite;
    }
    @keyframes btnScale { 0%,100%{transform:scale(1)} 50%{transform:scale(1.025)} }
    .cta-btn::after {
      content: "";
      position: absolute;
      top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent);
      animation: shimmer 2.5s ease-in-out infinite;
    }
    @keyframes shimmer { 0%{left:-100%} 70%,100%{left:160%} }
    .tg-icon { width: 20px; fill: #000; flex-shrink: 0; position: relative; z-index: 1; }
    .btn-text { position: relative; z-index: 1; }

    /* CREDIT */
    .credit {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,.45);
      text-align: center;
      letter-spacing: .3px;
    }
    .credit a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
